default_stages = ["pre-commit"]
default_install_hook_types = ["pre-commit"]
fail_fast = true

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "Cargo format check (workspace)"
entry = "cargo fmt --all -- --check"
language = "system"
pass_filenames = false
always_run = true
priority = 1

[[repos.hooks]]
id = "cargo-clippy"
name = "Cargo Clippy (workspace, all targets and features)"
entry = "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings"
language = "system"
pass_filenames = false
always_run = true
priority = 2

[[repos]]
repo = "https://github.com/fast/hawkeye"
rev = "12072370b89c4472ff8074e9e99582de1bfb696e" # v7.2.0

[[repos.hooks]]
id = "hawkeye-format"
name = "HawkEye license header check (7.2.0)"
entry = "hawkeye check --config licenserc.toml --"
priority = 0
