name: Review Linux reproduction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: Review Linux (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [root, crates]
        include:
          - suite: root
            target: //:hawdb_unit_tests
          - suite: crates
            target: //:hawdb_presubmit_crate_tests
    env:
      USE_BAZEL_VERSION: "9.3.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: d713e08807c1da8167ca9d3b8bc63f7bae368adb
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: review-linux-${{ matrix.suite }}
          repository-cache: true
          external-cache: true
      - name: Record source
        run: |
          mkdir -p review-evidence
          git rev-parse HEAD > review-evidence/source.txt
          git status --porcelain > review-evidence/worktree.txt
      - name: Run the existing test suite
        run: |
          set -o pipefail
          bazel test --keep_going --test_output=errors \
            ${{ matrix.target }} 2>&1 | tee review-evidence/build-log.txt
      - name: Collect complete native test logs
        if: always()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import tarfile
          root = Path("bazel-testlogs").resolve()
          with tarfile.open("review-evidence/test-logs.tar.gz", "w:gz") as archive:
              if root.exists():
                  for path in sorted(root.rglob("*")):
                      if path.is_file() and path.name in {"test.log", "test.xml"}:
                          archive.add(path, arcname=str(path.relative_to(root)), recursive=False)
          PYTHON
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: review-linux-${{ matrix.suite }}-d713e088
          path: review-evidence/
          if-no-files-found: error
