name: Archive PR 1217 Evidence

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ef38a62742ac705b862e194b25757fb166b53423
          path: source
          persist-credentials: false
      - name: Archive, upload and independently download every asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import tarfile

          repo = "nowledge-co/hawdb"
          source = "ef38a62742ac705b862e194b25757fb166b53423"
          tag_target = "720d98f8640105add1007040ac608df1e643fc3e"
          tag = "evidence-pr-1217-2026-10-24"
          root = Path("source/docs/benchmarks/publication_qualification_2026_10_23")
          out = Path("evidence")
          out.mkdir()
          actual = subprocess.check_output(["git", "-C", "source", "rev-parse", "HEAD"], text=True).strip()
          assert actual == source
          files = sorted(p for p in root.rglob("*") if p.is_file())
          assert len(files) == 1231
          assert sum(p.stat().st_size for p in files) == 372641221
          assert all(not p.is_symlink() for p in files)
          suffixes = (".gz", ".tar", ".jsonl", ".log", ".stdout", ".stderr")
          raw = [p for p in files if p.name.endswith(suffixes)]

          def sha256(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()

          archive = out / "publication-raw-ef38a627.tar"
          entries = []
          with tarfile.open(archive, "w", format=tarfile.PAX_FORMAT) as tar:
              for path in raw:
                  relative = path.relative_to(root).as_posix()
                  entries.append({"path": relative, "bytes": path.stat().st_size, "sha256": sha256(path)})
                  info = tarfile.TarInfo(relative)
                  info.size = path.stat().st_size
                  info.mode = 0o644
                  with path.open("rb") as stream:
                      tar.addfile(info, stream)
          manifest = {
              "format_version": 1,
              "source_revision": source,
              "original_tree_files": len(files),
              "original_tree_bytes": sum(p.stat().st_size for p in files),
              "release_tag": tag,
              "tag_target": tag_target,
              "archive": {
                  "name": archive.name,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{archive.name}",
                  "bytes": archive.stat().st_size,
                  "sha256": sha256(archive),
              },
              "files": entries,
          }
          manifest_path = out / "raw-manifest.json"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          artifact = out / "publication-resource-40049133474.zip"
          with artifact.open("wb") as stream:
              subprocess.run(["gh", "api", f"repos/{repo}/actions/artifacts/12544412288/zip"], stdout=stream, check=True)
          assert sha256(artifact) == "769de7476d6f13fe67ebd58d3b5aceaa4df60b071dd3f6519040c3dbe2a999f0"
          assets = [archive, artifact, manifest_path]
          checksums = out / "SHA256SUMS"
          checksums.write_text("".join(f"{sha256(p)}  {p.name}\n" for p in assets))
          assets.append(checksums)
          notes = out / "release-notes.md"
          notes.write_text(
              "# PR #1217 qualification evidence\n\n"
              "Evidence only; this is not a software release or a performance acceptance. "
              "The tag points to the existing main commit to avoid retaining raw evidence in a source tag.\n\n"
              f"Source snapshot: `{source}`. Raw paths and per-file SHA-256 values are in `raw-manifest.json`. "
              "The tar contains every selected raw archive, JSONL trace and log, including rejected and adverse runs.\n\n"
              "The dedicated 126-case publication/resource artifact is retained unchanged. "
              "It does not waive the separate reader/writer performance gate.\n\n"
              f"Archival verification: https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}\n"
          )
          subprocess.run(["gh", "release", "create", tag, "--repo", repo, "--target", tag_target,
                          "--title", "PR #1217 qualification evidence (2026-10-24)", "--notes-file", str(notes),
                          "--draft", "--prerelease", "--latest=false"], check=True)
          subprocess.run(["gh", "release", "upload", tag, "--repo", repo, *map(str, assets)], check=True)
          downloaded = out / "downloaded"
          subprocess.run(["gh", "release", "download", tag, "--repo", repo, "--dir", str(downloaded)], check=True)
          for path in assets:
              assert sha256(downloaded / path.name) == sha256(path), path.name
          with tarfile.open(downloaded / archive.name, "r") as tar:
              members = tar.getmembers()
              assert [m.name for m in members] == [entry["path"] for entry in entries]
              for member, entry in zip(members, entries):
                  assert member.isfile() and member.size == entry["bytes"]
                  with tar.extractfile(member) as stream:
                      assert hashlib.file_digest(stream, "sha256").hexdigest() == entry["sha256"]
          subprocess.run(["gh", "release", "edit", tag, "--repo", repo, "--draft=false", "--prerelease", "--latest=false"], check=True)
          receipt = {
              "source_revision": source,
              "release": f"https://github.com/{repo}/releases/tag/{tag}",
              "raw_files": len(entries),
              "raw_bytes": sum(entry["bytes"] for entry in entries),
              "original_tree_files": len(files),
              "original_tree_bytes": sum(p.stat().st_size for p in files),
              "roundtrip_download_and_all_member_hashes_verified": True,
              "assets": [{"name": p.name, "bytes": p.stat().st_size, "sha256": sha256(p)} for p in assets],
          }
          (out / "archive-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2))
          PYTHON
      - name: Retain compact archival verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-1217-evidence-archive-receipt
          path: |
            evidence/archive-receipt.json
            evidence/raw-manifest.json
            evidence/SHA256SUMS
            evidence/release-notes.md
          if-no-files-found: error
