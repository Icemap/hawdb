name: Explicit Numeric Resource Qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        rows: [1000, 100000, 1000000, 1000001]
        backend: [memory, file]
    env:
      USE_BAZEL_VERSION: "9.3.0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install explicit Arrow consumer
        run: python -m pip install pyarrow==26.0.0
      - name: Verify observer and receipt semantics
        run: |
          mkdir -p "$RUNNER_TEMP/resource-tests"
          python -B qualification/resource/test_observe.py --output "$RUNNER_TEMP/resource-tests/observer"
          python -B qualification/resource/test_consume.py
      - name: Build both producers before measurement
        run: bazel build -c opt //bindings/python:hawdb //bindings/python:_hawdb_boundary_profile
      - name: Run original numeric consumers with explicit limits
        run: |
          python -B qualification/resource/run.py --output "$RUNNER_TEMP/resource-evidence" --rows "${{ matrix.rows }}" --backend "${{ matrix.backend }}"
      - name: Preserve all outcomes including refusals
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: explicit-resource-${{ matrix.rows }}-${{ matrix.backend }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/resource-evidence
            ${{ runner.temp }}/resource-tests
          if-no-files-found: error
