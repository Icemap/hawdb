name: Preserve historical PR986 boundary observations
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Archive historical observations with content hashes
        run: |
          python3 - <<'PY_ARCHIVE'
          from pathlib import Path
          import subprocess,json,hashlib,os
          source='254f1cf38990dfbf6f7895b2a09cdc005aa9200a'
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('diff','--name-only',source,'HEAD').splitlines()==['.github/workflows/native-bindings.yml']
          assert not git('status','--porcelain')
          out=Path(os.environ['RUNNER_TEMP'])/'historical-observations';out.mkdir()
          reports=sorted(Path('bindings/benchmarks').glob('*observations.json'))
          assert len(reports)==5
          files=[]
          for report in reports:
              raw=report.read_bytes()
              assert raw==subprocess.check_output(['git','show',source+':'+report.as_posix()])
              (out/report.name).write_bytes(raw)
              files.append({'name':report.name,'source_path':report.as_posix(),'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
          (out/'manifest.json').write_text(json.dumps({'pr':986,'source':source,'archive_head':git('rev-parse','HEAD'),'files':files,'scope':'Historical reports, including adverse observations/refusals; not final-source acceptance'},indent=2)+'\n')
          print(json.dumps({'archived_files':len(files),'bytes':sum(x['bytes'] for x in files)}))
          PY_ARCHIVE
      - uses: actions/upload-artifact@v7
        with:
          name: pr986-historical-boundary-observations-254f1cf3
          path: ${{ runner.temp }}/historical-observations
          if-no-files-found: error
          retention-days: 90
