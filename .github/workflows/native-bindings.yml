name: MVCC Fixture Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      USE_BAZEL_VERSION: "9.3.0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Preserve diagnostic provenance
        run: |
          mkdir -p "$RUNNER_TEMP/fixture-source"
          git show -s --format='%H%n%T%n%P' > "$RUNNER_TEMP/fixture-source/source.txt"
          cp qualification/mvcc_fixture.py "$RUNNER_TEMP/fixture-source/"
          cp bindings/benchmarks/retained_boundary.py "$RUNNER_TEMP/fixture-source/"
      - name: Build the unchanged opt Python producer
        run: bazel build -c opt //bindings/python:hawdb
      - name: Match the original optional consumer import
        run: python -m pip install pyarrow==26.0.0
      - name: Compare fresh original and checkpoint fixture setup
        run: python -B qualification/mvcc_fixture.py --output "$RUNNER_TEMP/fixture-diagnosis"
      - name: Preserve diagnostic and adverse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mvcc-fixture-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fixture-source
            ${{ runner.temp }}/fixture-diagnosis/*.json
            ${{ runner.temp }}/fixture-diagnosis/*.log
            ${{ runner.temp }}/fixture-diagnosis/*/report.json
            ${{ runner.temp }}/fixture-diagnosis/*/progress.json
          if-no-files-found: error
