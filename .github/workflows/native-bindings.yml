name: Native Bindings

on:
  workflow_dispatch:
    inputs:
      runtime_qualification:
        description: "Run source-bound full root/crates/Python qualification"
        type: boolean
        default: false
      boundary_comparison:
        description: "Run the manual Linux ordinary-boundary comparison instead of binding tests"
        type: boolean
        default: false
      benchmark_sizes:
        description: "Comma-separated row counts; default is the complete three-size matrix"
        type: string
        default: "1000,100000,1000000"
      benchmark_cases:
        description: "Comma-separated workload cases"
        type: string
        default: "select,point,fill,fill_bulk,wide"
      benchmark_samples:
        description: "Measured iterations, in addition to one discarded iteration"
        type: string
        default: "3"
      benchmark_layers:
        description: "Comma-separated language layers; select a shard without changing its workload"
        type: string
        default: "rust,python,go"
      benchmark_backends:
        description: "Comma-separated storage backends"
        type: string
        default: "memory,file"
      rabitq_baseline:
        description: "Run the manual RaBitQ baseline instead of binding checks"
        type: boolean
        default: false
  pull_request:
    paths:
      - "src/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/cargo-test-required.sh"
      - "bindings/ffi/**"
      - "bindings/go/**"
      - "MODULE.bazel"
      - "BUILD.bazel"
      - ".bazelrc"
      - ".bazelversion"
      - ".github/workflows/native-bindings.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/cargo-test-required.sh"
      - "bindings/ffi/**"
      - "bindings/go/**"
      - "MODULE.bazel"
      - "BUILD.bazel"
      - ".bazelrc"
      - ".bazelversion"
      - ".github/workflows/native-bindings.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.boundary_comparison }}-${{ inputs.benchmark_sizes }}-${{ inputs.benchmark_cases }}-${{ inputs.benchmark_layers }}-${{ inputs.benchmark_backends }}-${{ inputs.benchmark_samples }}
  cancel-in-progress: true

jobs:
  bazel:
    if: (github.event_name != 'workflow_dispatch' || (!inputs.boundary_comparison && !inputs.rabitq_baseline)) && !inputs.runtime_qualification
    name: Bazel native bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        include:
          - os: ubuntu-24.04
            library: libhawdb_ffi.so
          - os: macos-latest
            library: libhawdb_ffi.dylib
    env:
      USE_BAZEL_VERSION: "9.3.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Build the C ABI libraries and Go package
        run: bazel build //bindings/ffi:hawdb_ffi //bindings/ffi:hawdb_ffi_static //bindings/go:hawdb

      - name: Test Go against the Bazel-built C ABI
        run: bazel test --test_output=errors --test_arg=-test.v //bindings/go:hawdb_go_tests

      - name: Test the retained C ABI contract
        run: bazel test --test_output=errors //bindings/ffi:hawdb_ffi_tests

      - name: Install Go for the race detector
        uses: actions/setup-go@v7
        with:
          go-version-file: bindings/go/go.mod
          cache-dependency-path: bindings/go/go.sum

      - name: Check retained read and close concurrency with the race detector
        working-directory: bindings/go
        env:
          HAWDB_LIBRARY: ${{ github.workspace }}/bazel-bin/bindings/ffi/${{ matrix.library }}
          # The race runtime needs cgo; the production package stays purego.
          CGO_ENABLED: "1"
        # The Go test cache does not qualify the newly built dynamic library.
        run: go test -race -count=1 -run '^TestRetained' ./...

  windows-native-contracts:
    if: (github.event_name != 'workflow_dispatch' || (!inputs.boundary_comparison && !inputs.rabitq_baseline)) && !inputs.runtime_qualification
    name: Windows native contracts
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy

      - name: Record tested source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p windows-native-results
          git log -1 --format='%H%n%T%n%P' > windows-native-results/source.txt
          rustc --version --verbose > windows-native-results/toolchain.txt

      - name: Run strict native Windows Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings \
            2>&1 | tee windows-native-results/clippy.txt

      - name: Build and test the retained Windows C ABI
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path bindings/ffi/Cargo.toml --lib
          bash scripts/cargo-test-required.sh --locked --manifest-path bindings/ffi/Cargo.toml --lib retained:: -- --nocapture \
            2>&1 | tee windows-native-results/retained-ffi.txt

      - name: Install Go for Windows numeric bindings
        uses: actions/setup-go@v7
        with:
          go-version-file: bindings/go/go.mod
          cache-dependency-path: bindings/go/go.sum

      - name: Test Go against the Windows C ABI
        shell: bash
        working-directory: bindings/go
        run: |
          set -euo pipefail
          HAWDB_LIBRARY="$GITHUB_WORKSPACE/bindings/ffi/target/debug/hawdb_ffi.dll" \
            go test -count=1 -v ./... 2>&1 | tee ../../windows-native-results/go.txt

      - name: Test retained indexed node ownership and task controls
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb --features tokio-runtime \
            --lib api::retained_query::node::tests -- --nocapture \
            2>&1 | tee windows-native-results/retained-node.txt

      - name: Test retained Arrow array and stream contracts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb --all-features --lib \
            api::retained_query::tests::arrow -- --nocapture \
            2>&1 | tee windows-native-results/retained-arrow.txt

      - name: Test abandonment GC power-loss cuts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb --all-features --lib \
            api::tests::power_loss::branch_abandonment::abandonment_gc_cuts_preserve_quarantine_and_live_branches \
            -- --exact --nocapture --test-threads=1 \
            2>&1 | tee windows-native-results/abandonment.txt

      - name: Preserve Windows validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-native-contracts-${{ github.sha }}
          path: windows-native-results
          if-no-files-found: error

  boundary-comparison:
    if: github.event_name == 'workflow_dispatch' && inputs.boundary_comparison
    name: Manual ordinary-boundary comparison (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      USE_BAZEL_VERSION: "9.3.0"
      BENCHMARK_SIZES: ${{ inputs.benchmark_sizes }}
      BENCHMARK_CASES: ${{ inputs.benchmark_cases }}
      BENCHMARK_SAMPLES: ${{ inputs.benchmark_samples }}
      BENCHMARK_LAYERS: ${{ inputs.benchmark_layers }}
      BENCHMARK_BACKENDS: ${{ inputs.benchmark_backends }}
    steps:
      - name: Checkout the candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Install Go for provenance
        uses: actions/setup-go@v7
        with:
          go-version-file: bindings/go/go.mod
          cache-dependency-path: bindings/go/go.sum

      - name: Compare frozen ordinary producers with unchanged defaults
        run: |
          python3 -B bindings/benchmarks/compare.py \
            --output "$RUNNER_TEMP/hawdb-boundary-comparison" \
            --sizes "$BENCHMARK_SIZES" --cases "$BENCHMARK_CASES" \
            --layers "$BENCHMARK_LAYERS" --backends "$BENCHMARK_BACKENDS" \
            --samples "$BENCHMARK_SAMPLES"

      - name: Preserve complete or partial evidence, including failed outcomes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ordinary-boundary-comparison-${{ github.sha }}
          path: ${{ runner.temp }}/hawdb-boundary-comparison/evidence
          if-no-files-found: error

  rabitq-baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.rabitq_baseline
    name: Manual RaBitQ baseline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            architecture: x86_64
          - os: macos-latest
            architecture: arm64
    env:
      HAWDB_RABITQ_BENCH_BUILD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy

      - name: Record native environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.architecture }}"
          mkdir -p "$RUNNER_TEMP/rabitq-baseline"
          git log -1 --format='%H%n%T%n%P' > "$RUNNER_TEMP/rabitq-baseline/source.txt"
          rustc --version --verbose > "$RUNNER_TEMP/rabitq-baseline/toolchain.txt"
          uname -a > "$RUNNER_TEMP/rabitq-baseline/system.txt"
          df -h "$RUNNER_TEMP" >> "$RUNNER_TEMP/rabitq-baseline/system.txt"
          if [ "$(uname -s)" = "Darwin" ]; then
            for key in machdep.cpu.brand_string hw.logicalcpu hw.physicalcpu hw.memsize hw.l1dcachesize hw.l2cachesize hw.l3cachesize; do
              sysctl "$key" >> "$RUNNER_TEMP/rabitq-baseline/cpu.txt" 2>&1 || true
            done
          else
            lscpu > "$RUNNER_TEMP/rabitq-baseline/cpu.txt"
            cat /proc/meminfo >> "$RUNNER_TEMP/rabitq-baseline/system.txt"
          fi

      - name: Check the native benchmark code
        run: cargo clippy --locked -p hawdb-vector-projection --all-targets --features storage-io -- -D warnings

      - name: Record the complete scalar matrix
        shell: bash
        env:
          HAWDB_RABITQ_BENCH_ARTIFACTS: ${{ runner.temp }}/rabitq-baseline/artifacts
          HAWDB_RABITQ_BENCH_OUTPUT: ${{ runner.temp }}/rabitq-baseline/samples.jsonl
        run: |
          set -euo pipefail
          cargo test --locked --release -p hawdb-vector-projection --features storage-io \
            kernel::benchmark::candidate_scan_matrix -- --exact --ignored --nocapture --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/rabitq-baseline/run.log"
          python3 scripts/summarize-rabitq-baseline.py \
            "$HAWDB_RABITQ_BENCH_OUTPUT" "$RUNNER_TEMP/rabitq-baseline/audit.json"

      - name: Preserve raw measurements and checksummed artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rabitq-baseline-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/rabitq-baseline
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  runtime-qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.runtime_qualification
    name: Full runtime qualification (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lane: [root, crates, python]
    env:
      USE_BAZEL_VERSION: "9.3.0"
      QUAL_LANE: ${{ matrix.lane }}
    steps:
      - name: Checkout qualification source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Verify production source and qualification overlay
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tempfile
          engine = "311091da6b23a292b7385b46362d3a12f6ec0064"
          main = "46bfde00131a6d711d51aad6e5e237279a287061"
          expected_tree = "6ea7fb5da52df432df022ac29eab4a74baa6c27b"
          workflow = ".github/workflows/native-bindings.yml"
          out = pathlib.Path("runtime-qualification-results")
          out.mkdir(exist_ok=True)
          def git(*args, env=None):
              return subprocess.check_output(["git", *args], text=True, env=env).strip()
          assert git("rev-parse", "HEAD^1") == engine
          subprocess.run(["git", "merge-base", "--is-ancestor", main, engine], check=True)
          assert git("diff", "--name-only", engine, "HEAD").splitlines() == [workflow]
          fd, index_path = tempfile.mkstemp(prefix="runtime-source-index-")
          os.close(fd)
          os.unlink(index_path)
          try:
              env = {**os.environ, "GIT_INDEX_FILE": index_path}
              subprocess.run(["git", "read-tree", "HEAD"], env=env, check=True)
              mode, _, blob, _ = git("ls-tree", engine, "--", workflow).split()
              subprocess.run(["git", "update-index", "--cacheinfo", mode + "," + blob + "," + workflow], env=env, check=True)
              production_tree = git("write-tree", env=env)
              assert production_tree == expected_tree
          finally:
              pathlib.Path(index_path).unlink(missing_ok=True)
          record = {"published_pr_head": engine, "current_main": main, "qualification_head": git("rev-parse", "HEAD"), "qualification_tree": git("rev-parse", "HEAD^{tree}"), "production_integration_tree": production_tree, "qualification_overlay": [workflow], "lane": os.environ["QUAL_LANE"], "scope": "Standalone current-main integration tests; not a Prow/Tide status or approval. No fuzz campaign, deadline or internal thread override."}
          (out / "source-check.json").write_text(json.dumps(record, indent=2) + "\n")
          (out / "source.txt").write_text(git("show", "-s", "--format=%H%n%T%n%P", "HEAD") + "\n")
          (out / "toolchain.txt").write_bytes(subprocess.check_output(["rustc", "-vV"]))
          PY
      - name: Run complete declared runtime scope
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, sys
          recorded = {'crates': ['//crates/analytics:hawdb_analytics_tests',
                      '//crates/cascades:hawdb_cascades_integration_test',
                      '//crates/cascades:hawdb_cascades_tests',
                      '//crates/cgroup:hawdb_cgroup_tests',
                      '//crates/core:hawdb_core_tests',
                      '//crates/ddl:hawdb_ddl_tests',
                      '//crates/evidence:hawdb_evidence_tests',
                      '//crates/fuzz-contracts:hawdb_fuzz_contracts_tests',
                      '//crates/integrity:hawdb_integrity_tests',
                      '//crates/optimizer:hawdb_optimizer_tests',
                      '//crates/optimizer-predicate:hawdb_optimizer_predicate_tests',
                      '//crates/optimizer-relational:hawdb_optimizer_relational_tests',
                      '//crates/optimizer-vector:hawdb_optimizer_vector_tests',
                      '//crates/plan-core:hawdb_plan_core_tests',
                      '//crates/qos:hawdb_qos_loom_tests',
                      '//crates/qos:hawdb_qos_tests',
                      '//crates/query:hawdb_query_tests',
                      '//crates/route-ownership:hawdb_route_ownership_tests',
                      '//crates/search:hawdb_search_analyzer_workspace_allocation_tests',
                      '//crates/search:hawdb_search_identifier_allocation_tests',
                      '//crates/sql-syntax:hawdb_sql_syntax_tests',
                      '//crates/sql-syntax:postgres_pgq_tests',
                      '//crates/sql-syntax:postgres_select_pgq_tests',
                      '//crates/system-sql:hawdb_system_sql_loom_tests',
                      '//crates/telemetry:hawdb_telemetry_tests',
                      '//crates/artifact:hawdb_artifact_tests',
                      '//crates/bootstrap:hawdb_bootstrap_tests',
                      '//crates/compat:hawdb_compat_tests',
                      '//crates/cypher:hawdb_cypher_tests',
                      '//crates/executor:hawdb_executor_unit_tests',
                      '//crates/executor:hawdb_morsel_oracle_tests',
                      '//crates/executor:hawdb_projection_allocation_tests',
                      '//crates/executor:hawdb_query_observer_release_tests',
                      '//crates/explain:hawdb_explain_tests',
                      '//crates/expression:hawdb_expression_tests',
                      '//crates/nowledge-contracts:hawdb_nowledge_contracts_tests',
                      '//crates/optimizer-graph:hawdb_optimizer_graph_tests',
                      '//crates/optimizer-graph:planner_golden_test',
                      '//crates/plan-cache:hawdb_plan_cache_loom_tests',
