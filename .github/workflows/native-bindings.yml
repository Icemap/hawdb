name: Preserve historical PR986 raw evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify and archive unchanged historical reports
        run: |
          python3 - <<'PY_ARCHIVE'
          from pathlib import Path
          import subprocess,json,hashlib,os
          source='254f1cf38990dfbf6f7895b2a09cdc005aa9200a'
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('diff','--name-only',source,'HEAD').splitlines()==['.github/workflows/native-bindings.yml']
          assert not git('status','--porcelain')
          paths=git('diff','--diff-filter=A','--name-only','b3f00e6d7a7e55e8ac3435d6f01514c9af70bf44...'+source,'--','bindings/benchmarks/evidence').splitlines()
          assert len(paths)==25
          out=Path(os.environ['RUNNER_TEMP'])/'historical-evidence';out.mkdir()
          files=[]
          for relative in paths:
              data=subprocess.check_output(['git','show',source+':'+relative])
              assert Path(relative).read_bytes()==data
              (out/Path(relative).name).write_bytes(data)
              files.append({'path':relative,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          (out/'manifest.json').write_text(json.dumps({'source':source,'files':files,'scope':'Historical reports archived before removal from final PR diff; no new benchmark qualification'},indent=2)+'\n')
          print(json.dumps({'files':len(files),'bytes':sum(x['bytes'] for x in files)}))
          PY_ARCHIVE
      - uses: actions/upload-artifact@v7
        with:
          name: pr986-historical-raw-evidence-254f1cf3
          path: ${{ runner.temp }}/historical-evidence
          if-no-files-found: error
          retention-days: 90
