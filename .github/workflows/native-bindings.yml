name: Native Bindings

on:
  workflow_dispatch:
    inputs:
      boundary_comparison:
        description: "Run the manual Linux ordinary-boundary comparison instead of binding tests"
        type: boolean
        default: false
      benchmark_sizes:
        description: "Comma-separated row counts; default is the complete three-size matrix"
        type: string
        default: "1000,100000,1000000"
      benchmark_cases:
        description: "Comma-separated workload cases"
        type: string
        default: "select,point,fill,fill_bulk,wide"
      benchmark_samples:
        description: "Measured iterations, in addition to one discarded iteration"
        type: string
        default: "3"
      benchmark_layers:
        description: "Comma-separated language layers; select a shard without changing its workload"
        type: string
        default: "rust,python,go"
      benchmark_backends:
        description: "Comma-separated storage backends"
        type: string
        default: "memory,file"
      rabitq_baseline:
        description: "Run the manual RaBitQ baseline instead of binding checks"
        type: boolean
        default: false
      windows_power_loss_test_threads:
        description: "Parallel Windows GC fault groups (repository uses its variable or 4)"
        type: choice
        default: "repository"
        options: ["repository", "1", "2", "4", "8"]
  pull_request:
    paths:
      - "src/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/cargo-test-required.sh"
      - "bindings/ffi/**"
      - "bindings/go/**"
      - "MODULE.bazel"
      - "BUILD.bazel"
      - ".bazelrc"
      - ".bazelversion"
      - ".github/workflows/native-bindings.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/cargo-test-required.sh"
      - "bindings/ffi/**"
      - "bindings/go/**"
      - "MODULE.bazel"
      - "BUILD.bazel"
      - ".bazelrc"
      - ".bazelversion"
      - ".github/workflows/native-bindings.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.boundary_comparison }}-${{ inputs.benchmark_sizes }}-${{ inputs.benchmark_cases }}-${{ inputs.benchmark_layers }}-${{ inputs.benchmark_backends }}-${{ inputs.benchmark_samples }}
  cancel-in-progress: true

jobs:
  bazel:
    if: github.event_name != 'workflow_dispatch' || (!inputs.boundary_comparison && !inputs.rabitq_baseline)
    name: Bazel native bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        include:
          - os: ubuntu-24.04
            library: libhawdb_ffi.so
          - os: macos-latest
            library: libhawdb_ffi.dylib
    env:
      USE_BAZEL_VERSION: "9.3.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Build the C ABI libraries and Go package
        run: bazel build //bindings/ffi:hawdb_ffi //bindings/ffi:hawdb_ffi_static //bindings/go:hawdb

      - name: Test Go against the Bazel-built C ABI
        run: bazel test --test_output=errors --test_arg=-test.v //bindings/go:hawdb_go_tests

      - name: Test original generation spool ownership
        run: >-
          bazel test --test_output=errors --test_arg=generation_spool
          //crates/search:hawdb_search_tests

      - name: Test consumer publication and reopen on Unix
        run: >-
          bazel test --test_output=errors
          //:hawdb_search_projection_consumer_tests
          //:hawdb_search_projection_consumer_minimal_tests

      - name: Test the retained C ABI contract
        run: bazel test --test_output=errors //bindings/ffi:hawdb_ffi_tests

      - name: Install Go for the race detector
        uses: actions/setup-go@v7
        with:
          go-version-file: bindings/go/go.mod
          cache-dependency-path: bindings/go/go.sum

      - name: Check retained read and close concurrency with the race detector
        working-directory: bindings/go
        env:
          HAWDB_LIBRARY: ${{ github.workspace }}/bazel-bin/bindings/ffi/${{ matrix.library }}
          # The race runtime needs cgo; the production package stays purego.
          CGO_ENABLED: "1"
        # The Go test cache does not qualify the newly built dynamic library.
        run: go test -race -count=1 -run '^TestRetained' ./...

  captured-search-integration:
    if: github.event_name != 'workflow_dispatch' || !inputs.rabitq_baseline
    name: Captured Search integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-2025]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Record tested source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p captured-search-results
          git log -1 --format='%H%n%T%n%P' > captured-search-results/source.txt
          rustc --version --verbose > captured-search-results/toolchain.txt

      - name: Test captured immutable file custody
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-storage --all-features --lib \
            -- file_io::captured_immutable::tests:: --nocapture --test-threads=1 \
            2>&1 | tee captured-search-results/immutable-custody.txt

      - name: Test captured database directory ownership
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-storage --all-features --lib \
            -- ownership::tests:: --nocapture --test-threads=1 \
            2>&1 | tee captured-search-results/database-directory-ownership.txt

      - name: Test captured project metadata reads
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-storage --all-features --lib \
            -- branch_project::tests:: --nocapture --test-threads=1 \
            2>&1 | tee captured-search-results/project-metadata.txt

      - name: Test public projection source epoch coherence
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb --all-features --lib \
            -- api::tests::search_projection_graph_delta:: \
            legacy_registered_prefix_1043_refuses_before_hydration_and_reopens_complete_retry \
            --nocapture --test-threads=1 \
            2>&1 | tee captured-search-results/projection-source-epoch.txt

      - name: Test original generation input ownership
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-search --all-features --lib \
            -- held_generation_spool_ --nocapture --test-threads=1 \
            2>&1 | tee captured-search-results/held-generation-spool.txt

      - name: Test captured publication lock binding
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-storage --all-features --lib \
            -- captured_file_binding_ --nocapture --test-threads=1 \
            2>&1 | tee captured-search-results/captured-lock-binding.txt

      - name: Test captured publication leases
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-search --all-features --lib \
            -- out_of_core::publish_lease::tests:: --nocapture --test-threads=1 \
            2>&1 | tee captured-search-results/captured-publication-lease.txt

      - name: Test Consumer generation metadata identity
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-search --all-features --lib \
            -- consumer::generation_metadata::tests:: --nocapture --test-threads=1 \
            2>&1 | tee captured-search-results/consumer-generation-metadata.txt

      - name: Test native Consumer birth and no-effect settlement
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb --all-features --lib \
            -- consumer_native_birth_ consumer_native_candidate_output_ consumer_native_candidate_metadata_ consumer_native_generation_metadata_ consumer_native_settlement_ consumer_native_retirement_ --nocapture --test-threads=1 \
            2>&1 | tee captured-search-results/consumer-native-birth.txt

      - name: Test durable Consumer allocation and activation refusal
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb --all-features --lib \
            -- api::search_projection_consumer::tests::consumer_allocation_ \
            api::search_projection_consumer::tests::empty_source_epoch_zero_and_repeated_catch_up_are_valid \
            consumer_allocation_crash_images_preserve_reservation_barriers_and_nonreuse \
            --nocapture --test-threads=1 \
            2>&1 | tee captured-search-results/consumer-allocation.txt

      - name: Test deferred project capture and original namespace retry
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb --all-features --test branch_project_open \
            -- deferred_admission_rejects_cloned_project_namespace_and_retries_original \
            captured_project_survives_branch_selection_and_refuses_replaced_namespace \
            metadata_open_and_show_survive_busy_main_and_data_admission_can_retry \
            --nocapture --test-threads=1 \
            2>&1 | tee captured-search-results/deferred-project-capture.txt

      - name: Test captured branch admission ownership and head readers
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-storage --all-features --lib \
            -- captured_admission_ opened_head_reader_ \
            --nocapture --test-threads=1 \
            2>&1 | tee captured-search-results/captured-branch-admission.txt

      - name: Test captured active WAL replay, append, rollback and guarded repair
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-storage --all-features --lib \
            -- captured_active_wal_ opened_wal_prefix_ \
            held_wal_rollback_ captured_wal_append_ captured_wal_namespace_barrier_ \
            --nocapture --test-threads=1 \
            2>&1 | tee captured-search-results/captured-active-wal.txt

      - name: Test held Windows publication descriptor policy
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-storage --all-features --lib \
            -- windows_replacement_policy_funds_held_candidate_and_rename_together \
            --nocapture --test-threads=1 \
            2>&1 | tee captured-search-results/windows-publication-descriptors.txt

      - name: Test captured metadata pending recovery descriptor boundary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb --all-features --test branch_project_open \
            -- pending_recovery_preserves_evidence_below_native_fd_peak_and_completes_at_peak \
            writable_open_recovers_pending_children_with_aggregate_limits_and_no_runtime \
            --nocapture --test-threads=1 \
            2>&1 | tee captured-search-results/project-metadata-recovery.txt

      - name: Test late branch descriptor refusal and target custody
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-storage --all-features --lib \
            -- late_descriptor_refusal_keeps_uuid_owner_through_cleanup_and_retries \
            --nocapture --test-threads=1 \
            2>&1 | tee captured-search-results/branch-admission-late-refusal.txt

      - name: Test branch admission within the original descriptor cap
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb --all-features --test branch_project_open \
            -- branch_selection_descriptor_refusal_keeps_source_and_retries_at_original_cap \
            cold_branch_creation_uses_actual_admission_inventory_with_twelve_descriptors \
            live_writer_reclamation_retains_readers_descendants_and_budget_retries \
            storage_inventory_tracks_selection_and_retries_budget_exhaustion \
            --nocapture --test-threads=1 \
            2>&1 | tee captured-search-results/branch-admission.txt

      - name: Test captured cleanup and originating operation admission
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-search --all-features --lib \
            -- out_of_core::captured_cleanup::admission_tests:: \
            out_of_core::generation_writer::tests::initial::initial_artifact_admission_splits_oversized_candidates_without_recapturing_bodies \
            generation_cleanup::tests:: --nocapture --test-threads=1 \
            2>&1 | tee captured-search-results/cleanup-admission.txt

      - name: Test private captured directory creation and crash cuts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-storage --all-features --lib \
            -- file_io::source_directory::directory_candidate::tests:: \
            recorded_directory_candidate_keeps_creation_evidence_and_empty_removal_cuts \
            recorded_creation_refusal_before_native_effect_leaves_candidate_unowned \
            --nocapture --test-threads=1 \
            2>&1 | tee captured-search-results/private-directory.txt

      - name: Test governed scratch spills and deferred original-custody cleanup
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-search --all-features --lib \
            -- governed_cleanup_spills_reopens_and_removes_only_in_its_captured_scratch_namespace \
            lost_response_after_creation_retains_original_custody_and_retries_off_replacement_root \
            --nocapture --test-threads=1 \
            2>&1 | tee captured-search-results/private-scratch.txt

      - name: Test resident producer references
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-search --all-features --lib \
            -- resident_sidecar_producer_references_reject_installed_same_length_changes \
            resident_segment_and_lexical_producer_references_reject_installed_same_length_changes \
            lexical_projection::build_manifest::tests::verified_build_reader_retains_metadata_until_its_last_clone_drops \
            --nocapture --test-threads=1 \
            2>&1 | tee captured-search-results/resident-producer.txt

      - name: Test captured root, replacement namespace and resident retention
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-search --all-features --lib \
            -- out_of_core::admitted_root::tests:: out_of_core::root_registry::tests:: \
            build_memory::read::tests:: --nocapture --test-threads=1 \
            2>&1 | tee captured-search-results/root-and-namespace.txt

      - name: Preserve captured Search integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: captured-search-integration-${{ matrix.os }}-${{ github.sha }}
          path: captured-search-results
          if-no-files-found: error

  windows-native-contracts:
    if: github.event_name != 'workflow_dispatch' || (!inputs.boundary_comparison && !inputs.rabitq_baseline)
    name: Windows native contracts
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy

      - name: Record tested source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p windows-native-results
          git log -1 --format='%H%n%T%n%P' > windows-native-results/source.txt
          rustc --version --verbose > windows-native-results/toolchain.txt

      - name: Run strict native Windows Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings \
            2>&1 | tee windows-native-results/clippy.txt

      - name: Test captured catalogs, source directories and crash-image operations
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-storage --all-features --lib \
            -- file_io::source_directory:: projection_generation::tests:: power_loss::tests:: power_loss::image::tests:: \
            --nocapture --test-threads=1 \
            2>&1 | tee windows-native-results/source-directories.txt

      - name: Test original generation spool ownership
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-search --all-features --lib \
            -- generation_spool --nocapture --test-threads=1 \
            2>&1 | tee windows-native-results/held-generation-spool.txt

      - name: Test retained root custody and captured head reads
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-search --all-features --lib \
            -- out_of_core::root_registry::tests:: out_of_core::admitted_root::tests:: \
            build_memory::read::tests:: --nocapture --test-threads=1 \
            2>&1 | tee windows-native-results/root-custody.txt

      - name: Test Consumer generation metadata contracts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-search --all-features --lib \
            consumer::generation_metadata::tests:: -- --nocapture --test-threads=1 \
            2>&1 | tee windows-native-results/consumer-generation-metadata.txt

      - name: Test Search staged payload integrity
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-search --all-features --lib \
            -- generation_writer::io::tests:: generation_writer::tests::prepared::same_length_installed_ \
            --nocapture --test-threads=1 \
            2>&1 | tee windows-native-results/search-staged-payload-integrity.txt

      - name: Test exclusive directory publication and consumer relocation
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-storage --all-features --lib \
            file_io::rename_new::tests:: -- --nocapture --test-threads=1 \
            2>&1 | tee windows-native-results/directory-publication-storage.txt
          bash scripts/cargo-test-required.sh --locked -p hawdb-search --all-features --lib \
            consumer::tests:: -- --nocapture --test-threads=1 \
            2>&1 | tee windows-native-results/directory-publication-consumer.txt

      - name: Test complete graph algorithm identities
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb --lib -- identity_898_ --nocapture --test-threads=1
          bash scripts/cargo-test-required.sh --locked -p hawdb-executor --lib -- identity_898_ --nocapture --test-threads=1
          bash scripts/cargo-test-required.sh --locked -p hawdb-cypher --lib -- identity_898_ --nocapture --test-threads=1

      - name: Test explicit consumer publication refusal under retained ownership
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-search --all-features --lib \
            consumer::tests::windows_publication_refusal_preserves_receipt_and_native_lease \
            -- --exact --nocapture --test-threads=1 \
            2>&1 | tee windows-native-results/consumer-publication-refusal.txt
          bash scripts/cargo-test-required.sh --locked -p hawdb --all-features --lib \
            api::search_projection_consumer::tests::windows_consumer_creation_refuses_before_callback_or_publication \
            -- --exact --nocapture --test-threads=1 \
            2>&1 | tee windows-native-results/consumer-creation-refusal.txt

      - name: Test legacy projection source epoch fences
        shell: bash
        run: >-
          bash scripts/cargo-test-required.sh --locked -p hawdb --lib --
          _1043_ --nocapture --test-threads=1

      - name: Build and test the retained Windows C ABI
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path bindings/ffi/Cargo.toml --lib
          bash scripts/cargo-test-required.sh --locked --manifest-path bindings/ffi/Cargo.toml --lib retained:: -- --nocapture \
            2>&1 | tee windows-native-results/retained-ffi.txt

      - name: Install Go for Windows numeric bindings
        uses: actions/setup-go@v7
        with:
          go-version-file: bindings/go/go.mod
          cache-dependency-path: bindings/go/go.sum

      - name: Test Go against the Windows C ABI
        shell: bash
        working-directory: bindings/go
        run: |
          set -euo pipefail
          HAWDB_LIBRARY="$GITHUB_WORKSPACE/bindings/ffi/target/debug/hawdb_ffi.dll" \
            go test -count=1 -v ./... 2>&1 | tee ../../windows-native-results/go.txt

      - name: Test retained indexed node ownership and task controls
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb --features tokio-runtime \
            --lib api::retained_query::node::tests -- --nocapture \
            2>&1 | tee windows-native-results/retained-node.txt

      - name: Test retained Arrow array and stream contracts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb --all-features --lib \
            api::retained_query::tests::arrow -- --nocapture \
            2>&1 | tee windows-native-results/retained-arrow.txt

      - name: Test abandonment GC power-loss cuts
        # Run the full fault-cut matrix after a change reaches main; PRs still
        # execute the native Windows contracts above.
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          POWER_LOSS_TEST_THREADS: ${{ inputs.windows_power_loss_test_threads != 'repository' && inputs.windows_power_loss_test_threads || vars.HAWDB_WINDOWS_POWER_LOSS_TEST_THREADS || '4' }}
        run: |
          set -euo pipefail
          case "$POWER_LOSS_TEST_THREADS" in
            1|2|4|8) ;;
            *) echo "Windows power-loss test threads must be 1, 2, 4, or 8" >&2; exit 1 ;;
          esac
          echo "power_loss_test_threads=$POWER_LOSS_TEST_THREADS" \
            | tee windows-native-results/abandonment-config.txt
          bash scripts/cargo-test-required.sh --locked -p hawdb --all-features --lib \
            api::tests::power_loss::branch_abandonment:: \
            -- --nocapture --test-threads="$POWER_LOSS_TEST_THREADS" \
            2>&1 | tee windows-native-results/abandonment.txt
          # Keep all two-policy/four-cut groups in the required selection.
          # Adding another test to this module must also update this exact count.
          grep -Eq '^test result: ok\. 8 passed; 0 failed; 0 ignored;' \
            windows-native-results/abandonment.txt

      - name: Preserve Windows validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-native-contracts-${{ github.sha }}
          path: windows-native-results
          if-no-files-found: error

  boundary-comparison:
    if: github.event_name == 'workflow_dispatch' && inputs.boundary_comparison
    name: Manual ordinary-boundary comparison (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      USE_BAZEL_VERSION: "9.3.0"
      BENCHMARK_SIZES: ${{ inputs.benchmark_sizes }}
      BENCHMARK_CASES: ${{ inputs.benchmark_cases }}
      BENCHMARK_SAMPLES: ${{ inputs.benchmark_samples }}
      BENCHMARK_LAYERS: ${{ inputs.benchmark_layers }}
      BENCHMARK_BACKENDS: ${{ inputs.benchmark_backends }}
    steps:
      - name: Checkout the candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Install Go for provenance
        uses: actions/setup-go@v7
        with:
          go-version-file: bindings/go/go.mod
          cache-dependency-path: bindings/go/go.sum

      - name: Compare frozen ordinary producers with unchanged defaults
        run: |
          python3 -B bindings/benchmarks/compare.py \
            --output "$RUNNER_TEMP/hawdb-boundary-comparison" \
            --sizes "$BENCHMARK_SIZES" --cases "$BENCHMARK_CASES" \
            --layers "$BENCHMARK_LAYERS" --backends "$BENCHMARK_BACKENDS" \
            --samples "$BENCHMARK_SAMPLES"

      - name: Preserve complete or partial evidence, including failed outcomes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ordinary-boundary-comparison-${{ github.sha }}
          path: ${{ runner.temp }}/hawdb-boundary-comparison/evidence
          if-no-files-found: error

  rabitq-baseline:
    if: github.event_name == 'workflow_dispatch' && inputs.rabitq_baseline
    name: Manual RaBitQ baseline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            architecture: x86_64
          - os: macos-latest
            architecture: arm64
    env:
      HAWDB_RABITQ_BENCH_BUILD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy

      - name: Record native environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.architecture }}"
          mkdir -p "$RUNNER_TEMP/rabitq-baseline"
          git log -1 --format='%H%n%T%n%P' > "$RUNNER_TEMP/rabitq-baseline/source.txt"
          rustc --version --verbose > "$RUNNER_TEMP/rabitq-baseline/toolchain.txt"
          uname -a > "$RUNNER_TEMP/rabitq-baseline/system.txt"
          df -h "$RUNNER_TEMP" >> "$RUNNER_TEMP/rabitq-baseline/system.txt"
          if [ "$(uname -s)" = "Darwin" ]; then
            for key in machdep.cpu.brand_string hw.logicalcpu hw.physicalcpu hw.memsize hw.l1dcachesize hw.l2cachesize hw.l3cachesize; do
              sysctl "$key" >> "$RUNNER_TEMP/rabitq-baseline/cpu.txt" 2>&1 || true
            done
          else
            lscpu > "$RUNNER_TEMP/rabitq-baseline/cpu.txt"
            cat /proc/meminfo >> "$RUNNER_TEMP/rabitq-baseline/system.txt"
          fi

      - name: Check the native benchmark code
        run: cargo clippy --locked -p hawdb-vector-projection --all-targets --features storage-io -- -D warnings

      - name: Record the complete scalar matrix
        shell: bash
        env:
          HAWDB_RABITQ_BENCH_ARTIFACTS: ${{ runner.temp }}/rabitq-baseline/artifacts
          HAWDB_RABITQ_BENCH_OUTPUT: ${{ runner.temp }}/rabitq-baseline/samples.jsonl
        run: |
          set -euo pipefail
          cargo test --locked --release -p hawdb-vector-projection --features storage-io \
            kernel::benchmark::candidate_scan_matrix -- --exact --ignored --nocapture --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/rabitq-baseline/run.log"
          python3 scripts/summarize-rabitq-baseline.py \
            "$HAWDB_RABITQ_BENCH_OUTPUT" "$RUNNER_TEMP/rabitq-baseline/audit.json"

      - name: Preserve raw measurements and checksummed artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rabitq-baseline-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/rabitq-baseline
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
