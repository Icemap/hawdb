name: Resource Observer Qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Preserve exact source before dependency setup
        run: python3 -B qualification/resource/observer_probe.py --preflight-only --output "$RUNNER_TEMP/resource-observer"
      - name: Install the existing qualification Arrow version
        run: python3 -m pip install pyarrow==26.0.0
      - name: Probe process peak RSS and foreign pool observations
        run: python3 -B qualification/resource/observer_probe.py --output "$RUNNER_TEMP/resource-observer"
      - name: Preserve every outcome
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resource-observer-${{ github.sha }}
          path: ${{ runner.temp }}/resource-observer
          if-no-files-found: error
