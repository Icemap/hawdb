name: PR1051 exact-source complete general qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  general:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      USE_BAZEL_VERSION: "9.3.0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Record exact source identity
        run: |
          python3 - <<'PY_SOURCE'
          from pathlib import Path
          import subprocess,json,os
          source='214a3f0594b58ee89c58c20c6c98d39c1e25047d'
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('diff','--name-only',source,'HEAD').splitlines()==['.github/workflows/native-bindings.yml']
          assert not git('status','--porcelain')
          out=Path(os.environ['RUNNER_TEMP'])/'general-qualification';out.mkdir()
          (out/'source.json').write_text(json.dumps({'engine':source,'engine_tree':git('rev-parse',source+'^{tree}'),'checkout':git('rev-parse','HEAD'),'checkout_tree':git('rev-parse','HEAD^{tree}'),'overlay_files':['.github/workflows/native-bindings.yml'],'host_os':os.uname().sysname,'host_arch':os.uname().machine,'available_cpus':os.cpu_count(),'scope':'Complete default root general partition, original deadlines; not a waiver of local checkpoint-group failures or complete PR acceptance'},indent=2)+'\n')
          PY_SOURCE
      - name: Run complete original targets without test-result reuse
        run: |
          bazel test //:hawdb_unit_general_tests --nocache_test_results --test_output=errors --local_test_jobs=1 --build_event_json_file="${RUNNER_TEMP}/general-qualification/events.json"
      - name: Preserve complete partition logs and hashes
        if: always()
        run: |
          python3 - <<'PY_LOGS'
          from pathlib import Path
          import os,json,urllib.parse,hashlib,re
          out=Path(os.environ['RUNNER_TEMP'])/'general-qualification';out.mkdir(exist_ok=True)
          bep=out/'events.json';results=[]
          if bep.exists():
              for line in bep.read_text().splitlines():
                  try:event=json.loads(line)
                  except json.JSONDecodeError:continue
                  if 'testSummary' not in event:continue
                  label=event['id']['testSummary']['label'];summary=event['testSummary'];logs=[]
                  for kind in ['passed','failed']:
                      for index,item in enumerate(summary.get(kind,[])):
                          path=Path(urllib.parse.urlparse(item['uri']).path)
                          if not path.is_file():continue
                          name=label.replace('//','').replace('/','_').replace(':','_')+'-'+kind+'-'+str(index)+'.log'
                          raw=path.read_bytes();(out/name).write_bytes(raw)
                          logs.append({'name':name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'suite_summaries':re.findall(r'test result: (?:ok|FAILED)[^\n]*',raw.decode(errors='replace'))})
                  results.append({'label':label,'summary':summary,'logs':logs})
          (out/'receipts.json').write_text(json.dumps(results,indent=2)+'\n')
          files=[{'name':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.iterdir()) if p.is_file()]
          (out/'manifest.json').write_text(json.dumps({'files':files,'scope':'Raw complete-target outcomes, including failures/timeouts'},indent=2)+'\n')
          PY_LOGS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr1051-full-general-214a3f05
          path: ${{ runner.temp }}/general-qualification
          if-no-files-found: error
          retention-days: 90
