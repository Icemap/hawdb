name: Independent Query Qualification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Qualification mode
        type: choice
        default: ordinary
        options: [ordinary, go-bulk]

permissions:
  contents: read
  actions: read

jobs:
  ordinary:
    if: inputs.mode != 'go-bulk'
    name: Ordinary ${{ matrix.case }} (${{ matrix.backend }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: [select, point, fill, fill_bulk, wide]
        backend: [memory, file]
    env:
      USE_BAZEL_VERSION: "9.3.0"
      QUALIFICATION_CASE: ${{ matrix.case }}
      QUALIFICATION_BACKEND: ${{ matrix.backend }}
    steps:
      - name: Checkout qualification tools
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Record tools and prepare immutable sources
        shell: bash
        run: |
          set -euo pipefail
          cp -R qualification/independent-query-prs "$RUNNER_TEMP/qualification"
          git rev-parse HEAD > "$RUNNER_TEMP/qualification/qualification-revision.txt"
          uname -a > "$RUNNER_TEMP/qualification/platform.txt"
          lscpu > "$RUNNER_TEMP/qualification/cpu.txt"
          free -b > "$RUNNER_TEMP/qualification/memory.txt"
          df -Pk > "$RUNNER_TEMP/qualification/disk-before.txt"
          git clone --branch main https://github.com/nowledge-co/hawdb.git \
            "$RUNNER_TEMP/pr-986-result-accounting-source"
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "qualification/selection.json"
          selection = json.loads(path.read_text())
          selection["full_matrix"] = selection["ordinary"].copy()
          selection["ordinary"]["cases"] = [os.environ["QUALIFICATION_CASE"]]
          selection["ordinary"]["backends"] = [os.environ["QUALIFICATION_BACKEND"]]
          path.write_text(json.dumps(selection, indent=2) + "\n")
          PYTHON

      - name: Build and freeze all four opt producers
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/qualification/prepare-producers.py" \
            2>&1 | tee "$RUNNER_TEMP/qualification/prepare.log"

      - name: Verify all frozen language entrypoints
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/qualification/preflight.py" \
            2>&1 | tee "$RUNNER_TEMP/qualification/preflight.log"

      - name: Run complete rotating ordinary controls
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/qualification/ordinary.py" \
            2>&1 | tee "$RUNNER_TEMP/qualification/ordinary.log"

      - name: Preserve complete or partial evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ordinary-${{ matrix.case }}-${{ matrix.backend }}-${{ github.sha }}
          path: ${{ runner.temp }}/qualification
          if-no-files-found: error

  go-bulk:
    if: inputs.mode == 'go-bulk'
    name: Frozen Go bulk A/B and A/A
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout qualification tools
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record diagnostic host and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/diagnostic-host"
          git log -1 --format='%H%n%T%n%P' > "$RUNNER_TEMP/diagnostic-host/source.txt"
          uname -a > "$RUNNER_TEMP/diagnostic-host/platform.txt"
          lscpu > "$RUNNER_TEMP/diagnostic-host/cpu.txt"
          free -b > "$RUNNER_TEMP/diagnostic-host/memory.txt"

      - name: Reuse exact frozen original producers
        shell: bash
        run: |
          set -euo pipefail
          python3 -B qualification/independent-query-prs/diagnose-go-bulk.py \
            2>&1 | tee "$RUNNER_TEMP/diagnostic-host/run.log"

      - name: Preserve diagnostic raw evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frozen-go-bulk-${{ github.sha }}
          path: |
            ${{ runner.temp }}/go-bulk-diagnostic
            ${{ runner.temp }}/diagnostic-host
          if-no-files-found: error
