name: Final Source Integrated Main Control
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ordinary:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        size: [1000, 100000, 1000000]
        case: [fill_bulk, select, wide, point, fill]
        layer: [rust, python, go]
        backend: [memory, file]
    env:
      USE_BAZEL_VERSION: "9.3.0"
      ENGINE_COMMIT: 6881bbcc9809a6195d1bab38fb489aa3684c20fc
      BENCH_SIZE: ${{ matrix.size }}
      BENCH_CASE: ${{ matrix.case }}
      BENCH_LAYER: ${{ matrix.layer }}
      BENCH_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify frozen engine and unchanged workload
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          engine = os.environ["ENGINE_COMMIT"]
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          assert git("diff", "--name-only", engine, "HEAD").splitlines() == [".github/workflows/native-bindings.yml", "qualification/integrated_main_final.py"]
          assert not git("status", "--porcelain")
          receipt = {"engine": engine, "engine_tree": git("rev-parse", engine + "^{tree}"),
                     "checkout": git("rev-parse", "HEAD"), "checkout_tree": git("rev-parse", "HEAD^{tree}"),
                     "overlay": [".github/workflows/native-bindings.yml", "qualification/integrated_main_final.py"],
                     "case": os.environ["BENCH_CASE"], "layer": os.environ["BENCH_LAYER"], "backend": os.environ["BENCH_BACKEND"],
                     "sizes": [int(os.environ["BENCH_SIZE"])], "matrix_sizes": [1000, 100000, 1000000], "measured_samples": 3, "discarded_samples": 1,
                     "defaults_changed": False, "timed_consumers_changed": False,
                     "engine_default_result_rows": 0, "engine_session_default_result_rows": 0,
                     "matrix_groups": 90, "shards": 90, "max_parallel_jobs": 4, "per_job_deadline_minutes": 360,
                     "candidate_requires_final_head_equivalence": True,
                     "additional_baseline": "a1012720decca3844864c910360057a5c71dddd8",
                     "baseline_tree": "a0f5fcc0750a3a4c5f35925a16d4d07b481000e6",
                     "original_3c_campaign_unchanged": True,
                     "scope": "A shard alone does not establish full-matrix acceptance; preserve refusals and failures."}
          pathlib.Path(os.environ["RUNNER_TEMP"], "source-qualification.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt))
          PY
      - name: Preserve source receipt before long measurements
        uses: actions/upload-artifact@v7
        with:
          name: source-main-control-${{ matrix.size }}-${{ matrix.case }}-${{ matrix.layer }}-${{ matrix.backend }}-${{ github.sha }}
          path: ${{ runner.temp }}/source-qualification.json
          if-no-files-found: error
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: bindings/go/go.mod
          cache-dependency-path: bindings/go/go.sum
      - name: Compare frozen integrated-main and final-source producers
        env:
          CONTROL_OUTPUT: ${{ runner.temp }}/hawdb-boundary-comparison
        run: python3 -B qualification/integrated_main_final.py
      - name: Preserve source receipt alongside complete or partial outcomes
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/hawdb-boundary-comparison/evidence"
          cp "$RUNNER_TEMP/source-qualification.json" "$RUNNER_TEMP/hawdb-boundary-comparison/evidence/workflow-source-qualification.json"
      - name: Preserve all outcomes including refusals
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-control-${{ matrix.size }}-${{ matrix.case }}-${{ matrix.layer }}-${{ matrix.backend }}-${{ github.sha }}
          path: ${{ runner.temp }}/hawdb-boundary-comparison/evidence
          if-no-files-found: error
