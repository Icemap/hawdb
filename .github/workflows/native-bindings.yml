name: Manual retained numeric Windows qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retained-numeric-windows:
    name: Retained numeric ownership (Windows)
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      EXPECTED_ENGINE: 14e852d46b22769196027f3936229cdc1c21bfd0
      EXPECTED_TREE: e85554b29bffc04eb0173cfe39606a935c503d46
    steps:
      - name: Checkout frozen qualification source
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Verify exact production source and record toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p retained-numeric-windows-results
          test "$(git rev-parse "${EXPECTED_ENGINE}^{tree}")" = "$EXPECTED_TREE"
          test "$(git merge-base "$EXPECTED_ENGINE" HEAD)" = "$EXPECTED_ENGINE"
          changed=$(git diff --name-only "$EXPECTED_ENGINE" HEAD)
          test "$changed" = ".github/workflows/native-bindings.yml"
          test -z "$(git status --porcelain)"
          git log -1 --format='%H%n%T%n%P' > retained-numeric-windows-results/source.txt
          git show --format=fuller --no-patch "$EXPECTED_ENGINE" > retained-numeric-windows-results/engine.txt
          git diff "$EXPECTED_ENGINE" HEAD > retained-numeric-windows-results/workflow-only.patch
          rustc --version --verbose > retained-numeric-windows-results/toolchain.txt

      - name: Test root Rust numeric ownership and session limits
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb --all-features --lib \
            api::retained_query::tests:: -- --nocapture \
            2>&1 | tee retained-numeric-windows-results/root-numeric.txt

      - name: Test executor numeric ownership
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-executor --all-features --lib \
            numeric::retained:: -- --nocapture \
            2>&1 | tee retained-numeric-windows-results/executor-numeric.txt

      - name: Test shared retained admission
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-qos --all-features --lib \
            runtime::retained_result:: -- --nocapture \
            2>&1 | tee retained-numeric-windows-results/retained-admission.txt

      - name: Test COW capacity and checkpoint ownership
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-storage --all-features --lib \
            cow:: -- --nocapture \
            2>&1 | tee retained-numeric-windows-results/cow-ownership.txt

      - name: Test materialized source lifetime and admission
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/cargo-test-required.sh --locked -p hawdb-storage --all-features --lib \
            store::graph_read::retained_scan_tests:: -- --nocapture \
            2>&1 | tee retained-numeric-windows-results/source-ownership.txt

      - name: Preserve complete native qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retained-numeric-windows-${{ github.sha }}
          path: retained-numeric-windows-results
          if-no-files-found: error
