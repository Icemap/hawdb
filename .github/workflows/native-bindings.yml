                    '//:hawdb_search_projection_consumer_tests',
                    '//:hawdb_shadow_self_tests',
                    '//:hawdb_unit_analytics_core_general_tests',
                    '//:hawdb_unit_concurrent_tests',
                    '//:hawdb_unit_general_tests',
                    '//:hawdb_unit_recovery_tests',
                    '//:hawdb_unit_row_page_compaction_admission_tests',
                    '//:hawdb_unit_row_page_compaction_materialized_tests',
                    '//:hawdb_unit_row_page_compaction_out_of_core_tests',
                    '//:hawdb_unit_storage_crash_matrix_tests',
                    '//:hawdb_wal_group_commit_recovery_tests',
                    '//:hawdb_wasm_playground_bridge_tests',
                    '//:query_limit_inventory_test',
                    '//crates/system-sql:hawdb_system_sql_loom_tests']}
          lane = os.environ["QUAL_LANE"]
          out = pathlib.Path("runtime-qualification-results")
          assert len(recorded["root"]) == 58 and len(recorded["crates"]) == 95
          assert not any(t.startswith("//crates/fuzz:") or t.endswith("_fuzz_tests") or t == "//:hawdb_linux_ci_fuzz_smoke_test" for values in recorded.values() for t in values)
          def query(expr):
              value = subprocess.check_output(["bazel", "query", expr], text=True)
              return set(value.splitlines())
          if lane == "root":
              required = query("tests(//:hawdb_unit_tests) union tests(//:hawdb_linux_ci_smoke_tests)")
              selected = set(recorded[lane]) | required
              targets = sorted(selected)
          elif lane == "crates":
              selected = query("tests(//:hawdb_presubmit_crate_tests)")
              assert set(recorded[lane]) <= selected
              targets = ["//:hawdb_presubmit_crate_tests"]
          else:
              assert lane == "python"
              selected = set(recorded[lane])
              targets = sorted(selected)
          assert not any(t.startswith("//crates/fuzz:") or t.endswith("_fuzz_tests") or t == "//:hawdb_linux_ci_fuzz_smoke_test" for t in selected)
          assert all(re.fullmatch(r"//[A-Za-z0-9_./:-]+", t) for t in targets)
          command = ["bazel", "test", *targets, "--test_output=errors", "--build_event_json_file=" + str(out / "tests.bep.json")]
          (out / "selection.json").write_text(json.dumps({"lane": lane, "recorded_scope": recorded[lane], "selected_tests": sorted(selected), "command": command}, indent=2) + "\n")
          with (out / "command.log").open("wb") as log:
              child = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              for line in child.stdout:
                  log.write(line)
                  sys.stdout.buffer.write(line)
                  sys.stdout.buffer.flush()
              status = child.wait()
          (out / "command-result.json").write_text(json.dumps({"exit": status, "lane": lane}) + "\n")
          raise SystemExit(status)
          PY
      - name: Preserve complete test logs and source evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil, urllib.parse
          out = pathlib.Path("runtime-qualification-results")
          summaries = []
          bep = out / "tests.bep.json"
          if bep.exists():
              for line in bep.read_text().splitlines():
                  event = json.loads(line)
                  if "testSummary" not in event:
                      continue
                  label = event["id"]["testSummary"]["label"]
                  summary = event["testSummary"]
                  summaries.append({"label": label, "summary": summary})
                  for status in ("passed", "failed"):
                      for i, item in enumerate(summary.get(status, [])):
                          uri = item.get("uri", "")
                          if not uri.startswith("file://"):
                              continue
                          source = pathlib.Path(urllib.parse.unquote(urllib.parse.urlparse(uri).path))
                          name = label.removeprefix("//").replace("/", "_").replace(":", "_")
                          target = out / (name + "-" + status + "-" + str(i) + ".test.log")
                          shutil.copyfile(source, target)
          (out / "test-summaries.json").write_text(json.dumps(summaries, indent=2) + "\n")
          files = {str(p.relative_to(out)): {"bytes": p.stat().st_size, "sha256": hashlib.sha256(p.read_bytes()).hexdigest()} for p in out.rglob("*") if p.is_file()}
          (out / "files.json").write_text(json.dumps(files, indent=2) + "\n")
          PY
      - name: Upload runtime qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-qualification-${{ matrix.lane }}-${{ github.sha }}
          path: runtime-qualification-results
          if-no-files-found: error
