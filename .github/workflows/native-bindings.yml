name: Frozen Ordinary Boundary Qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ordinary:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: [fill_bulk, select, point, fill, wide]
        layer: [rust, python, go]
        backend: [memory, file]
    env:
      USE_BAZEL_VERSION: "9.3.0"
      ENGINE_COMMIT: a68cda8e605de113e7e8837176145b807f3c12a5
      BENCH_CASE: ${{ matrix.case }}
      BENCH_LAYER: ${{ matrix.layer }}
      BENCH_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify frozen engine and unchanged workload
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          engine = os.environ["ENGINE_COMMIT"]
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          assert git("diff", "--name-only", engine, "HEAD").splitlines() == [".github/workflows/native-bindings.yml"]
          assert not git("status", "--porcelain")
          receipt = {"engine": engine, "engine_tree": git("rev-parse", engine + "^{tree}"),
                     "checkout": git("rev-parse", "HEAD"), "checkout_tree": git("rev-parse", "HEAD^{tree}"),
                     "overlay": [".github/workflows/native-bindings.yml"],
                     "case": os.environ["BENCH_CASE"], "layer": os.environ["BENCH_LAYER"], "backend": os.environ["BENCH_BACKEND"],
                     "sizes": [1000, 100000, 1000000], "measured_samples": 3, "discarded_samples": 1,
                     "defaults_changed": False, "timed_consumers_changed": False,
                     "matrix_groups": 90, "max_parallel_jobs": 4, "per_job_deadline_minutes": 360,
                     "scope": "A shard alone does not establish full-matrix acceptance; preserve refusals and failures."}
          pathlib.Path(os.environ["RUNNER_TEMP"], "source-qualification.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt))
          PY
      - name: Preserve source receipt before long measurements
        uses: actions/upload-artifact@v7
        with:
          name: source-${{ matrix.case }}-${{ matrix.layer }}-${{ matrix.backend }}-${{ github.sha }}
          path: ${{ runner.temp }}/source-qualification.json
          if-no-files-found: error
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: bindings/go/go.mod
          cache-dependency-path: bindings/go/go.sum
      - name: Compare frozen ordinary producers
        run: |
          python3 -B bindings/benchmarks/compare.py \
            --output "$RUNNER_TEMP/hawdb-boundary-comparison" \
            --sizes 1000,100000,1000000 --samples 3 \
            --cases "$BENCH_CASE" --layers "$BENCH_LAYER" --backends "$BENCH_BACKEND"
      - name: Preserve source receipt alongside complete or partial outcomes
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/hawdb-boundary-comparison/evidence"
          cp "$RUNNER_TEMP/source-qualification.json" "$RUNNER_TEMP/hawdb-boundary-comparison/evidence/"
      - name: Preserve all outcomes including refusals
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ordinary-${{ matrix.case }}-${{ matrix.layer }}-${{ matrix.backend }}-${{ github.sha }}
          path: ${{ runner.temp }}/hawdb-boundary-comparison/evidence
          if-no-files-found: error
