name: Retained Source Qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retained:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        rows: [1000, 100000, 1000000]
        backend: [memory, file]
    env:
      USE_BAZEL_VERSION: "9.3.0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install explicit Arrow consumer
        run: python -m pip install pyarrow==26.0.0
      - name: Build all producers before measurement
        run: |
          bazel build -c opt //bindings/python:hawdb //bindings/ffi:hawdb_ffi //bindings/go:hawdb_go_tests
          bazel cquery -c opt //bindings/go:hawdb_go_tests --output=files > "$RUNNER_TEMP/go-producer.txt"
      - name: Run unchanged numeric and slow-reader controls
        env:
          QUAL_ROWS: ${{ matrix.rows }}
          QUAL_BACKEND: ${{ matrix.backend }}
        run: python -B qualification/retained/run.py --output "$RUNNER_TEMP/retained-evidence"
      - name: Preserve all outcomes including refusals
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retained-${{ matrix.rows }}-${{ matrix.backend }}-${{ github.sha }}
          path: ${{ runner.temp }}/retained-evidence
          if-no-files-found: error
