name: Exact Consumer Default Million-Row Recheck
on:
  workflow_dispatch:
    inputs:
      kind:
        type: choice
        options: [numeric, ordinary, resources, retained]
        default: retained
      rows:
        type: string
        default: "1000"
      backend:
        type: choice
        options: [memory, file]
        default: memory
      configuration:
        type: choice
        options: [default, large]
        default: default
      instrumented:
        type: boolean
        default: false
      case:
        type: string
        default: select
      layer:
        type: string
        default: rust
      samples:
        type: string
        default: "31"
permissions:
  contents: read
jobs:
  retained:
    if: inputs.kind == 'retained'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - configuration: default
            rows: 1000000
            backend: file
    env:
      USE_BAZEL_VERSION: "9.3.0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install explicit Arrow consumer
        run: python -m pip install pyarrow==26.0.0
      - name: Build Python producer before measurement
        run: |
          bazel build -c opt //bindings/python:hawdb
      - name: Verify the original native and timed-consumer bytes
        run: |
          python - <<'PY_PRODUCER'
          import hashlib, pathlib
          expected = {
              "bazel-bin/bindings/python/python/hawdb/_hawdb.so": "b3e7e4b380896f3be34461d2088d2b45382a4baab5fcda7c1a65d67032344404",
              "bindings/benchmarks/retained_boundary.py": "a9275fa36bd57feddc463a53b60f386d37bebba4337b4fee87040ba35ae3a9d1",
          }
          for name, digest in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == digest, name
          print("Original failed-group producer and consumer bytes verified; this is a separate recheck, not a waiver.")
          PY_PRODUCER
      - name: Run unchanged numeric delivery controls
        env:
          QUAL_CONFIGURATION: ${{ matrix.configuration }}
          QUAL_ROWS: ${{ matrix.rows }}
          QUAL_BACKEND: ${{ matrix.backend }}
        run: python -B qualification/retained/run.py --output "$RUNNER_TEMP/retained-evidence"
      - name: Preserve all outcomes including refusals
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: session-retained-${{ matrix.configuration }}-${{ matrix.rows }}-${{ matrix.backend }}-${{ github.sha }}
          path: ${{ runner.temp }}/retained-evidence
          if-no-files-found: error

