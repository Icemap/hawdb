[package]
name = "hawdb-mvcc-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
autolib = false

# A developer executable, never a member of the library's release workspace.
[workspace]

[[bin]]
name = "hawdb-mvcc-fuzz"
path = "src/main.rs"

[dependencies]
hawdb = { path = "../..", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
